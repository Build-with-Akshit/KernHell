[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kernhell"
version = "0.1.2"
description = "AI-Powered Autonomous Self-Healing Testing Engine — The Heart of Your System Where Innovation Meets Precision"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Ritesh", email = "ritesh@kernhell.dev" },
]
keywords = ["testing", "playwright", "self-healing", "ai", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.12,<1.0",
    "rich>=13.0,<16.0",
    "pydantic>=2.5,<3.0",
    "pydantic-settings>=2.1,<3.0",
    "playwright>=1.40,<2.0",
    "selectolax>=0.3,<2.0",
    "libcst>=1.1.0",
    "structlog>=24.0",
    "litellm>=1.30,<2.0",
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.27,<1.0",
    "pytest>=8.0,<9.0",
    "tomli>=2.0;python_version<'3.11'",
]

[project.optional-dependencies]
cache = [
    "chromadb>=0.4,<1.0",
    "sentence-transformers>=2.2,<3.0",
]
dashboard = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "aiosqlite>=0.19,<1.0",
]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.3,<1.0",
    "mypy>=1.8,<2.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]
all = ["kernhell[cache,dashboard,dev]"]

[project.scripts]
kernhell = "kernhell.cli.app:app"

[project.urls]
Homepage = "https://github.com/riteshkumar072/KernHell"
Documentation = "https://github.com/riteshkumar072/KernHell#readme"
Repository = "https://github.com/riteshkumar072/KernHell"
Issues = "https://github.com/riteshkumar072/KernHell/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/kernhell"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/kernhell",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/.kernhellrc.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests requiring Playwright browsers (deselect with '-m \"not integration\"')",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
