# KernHell Default Configuration
# Override by placing a copy at ~/.kernhellrc.toml or ./.kernhellrc.toml

[llm]
provider = "groq"                       # groq | openai | anthropic | ollama
model = "llama-3.3-70b-versatile"
temperature = 0.1
max_tokens = 2048

[healing]
confidence_threshold = 0.85
max_heals_per_file = 5
dry_run = false
auto_commit = false

[cache]
enabled = true
similarity_threshold = 0.92
cache_dir = "~/.kernhell/cache"
embedding_model = "all-MiniLM-L6-v2"

[scanner]
timeout_ms = 5000
capture_screenshot = true
browser = "chromium"                    # chromium | firefox | webkit
headless = true

[logging]
level = "INFO"                          # DEBUG | INFO | WARNING | ERROR
json_output = false                     # true for CI environments
