# KernHell Default Configuration
# Override by placing a copy at ~/.kernhellrc.toml or ./.kernhellrc.toml

[llm]
provider = "gemini"                       # gemini | groq | openai | anthropic | ollama
model = "gemini-1.5-flash"                # gemini-1.5-flash | gemini-2.0-flash | gemini-1.5-pro
temperature = 0.1
max_tokens = 2048
# api_key = ""                            # Optional: can also be set via GEMINI_API_KEY in .env

[healing]
confidence_threshold = 0.85
max_heals_per_file = 5
dry_run = false
auto_commit = false

[cache]
enabled = true
similarity_threshold = 0.92
cache_dir = "~/.kernhell/cache"
embedding_model = "all-MiniLM-L6-v2"

[scanner]
timeout_ms = 5000
capture_screenshot = true
browser = "chromium"                    # chromium | firefox | webkit
headless = true

[logging]
level = "INFO"                          # DEBUG | INFO | WARNING | ERROR
json_output = false                     # true for CI environments
