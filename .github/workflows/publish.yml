name: Publish to PyPI
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # Mandatory for Trusted Publishing (PyPI OIDC)

jobs:
  pypi-publish:
    name: Build & Publish Release to PyPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build & Verification Tools
        run: |
          python -m pip install --upgrade pip build twine

      - name: Build Source Distribution & Binary Wheel
        run: |
          python -m build

      - name: Verify Package Metadata
        run: |
          python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Works with both PyPI Trusted Publishing (OIDC) or PYPI_API_TOKEN secret
          password: ${{ secrets.PYPI_API_TOKEN }}
