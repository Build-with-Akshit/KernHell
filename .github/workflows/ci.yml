name: KernHell CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests:
    name: Engine Tests (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[all]"

      - name: Run Ruff Linting
        run: |
          ruff check src/

      - name: Execute Pytest Suite with Coverage
        run: |
          python -m pytest tests/unit -v --cov=src/kernhell --cov-report=term-missing

  dashboard-build:
    name: Mission Control Dashboard (Next.js Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./dashboard

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './dashboard/package.json'

      - name: Install Dashboard Dependencies
        run: npm install

      - name: Verify TypeScript & Next.js Production Build
        run: npm run build

  packaging-check:
    name: Package Build Verification (Wheel & SDist)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Wheel & Tarball
        run: |
          python -m pip install --upgrade pip build
          python -m build
