<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>E-Commerce Storefront - Checkout (Refactored)</title>
    <style>
        .cta-action { background: #10b981; color: white; padding: 14px 28px; }
    </style>
</head>
<body>
    <main role="main" class="checkout-v2">
        <h1>Review and Place Order</h1>
        <form id="order-flow" action="/submit-order" method="POST">
            <label for="user-email">Email Address</label>
            <input type="email" id="user-email" name="email" placeholder="you@domain.com" />

            <!-- Refactored button: ID changed from #buy-now to #purchase-btn, same role & intent -->
            <button type="submit" id="purchase-btn" class="cta-action" role="button" data-testid="complete-order-btn" aria-label="Complete Order">
                Place Your Order
            </button>
        </form>
    </main>
</body>
</html>
