<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>E-Commerce Storefront - Checkout</title>
    <style>
        .btn-primary { background: #ff4757; color: white; padding: 12px 24px; border-radius: 6px; }
        .cart-container { max-width: 800px; margin: 0 auto; display: flex; }
        .hidden-tracker { display: none; }
    </style>
    <script>
        console.log("Analytics tracker initialized");
        window.analytics = { track: function() {} };
    </script>
</head>
<body>
    <header role="banner" class="header-main">
        <nav role="navigation" aria-label="Main Navigation">
            <a href="/" class="nav-logo" aria-label="Home">ShopLogo</a>
            <ul>
                <li><a href="/products" class="nav-link">Products</a></li>
                <li><a href="/deals" class="nav-link">Deals</a></li>
                <li><a href="/cart" class="nav-link" aria-label="Shopping Cart">Cart (2)</a></li>
            </ul>
        </nav>
    </header>

    <main role="main" class="checkout-page">
        <h1>Review and Place Order</h1>

        <div class="cart-items-wrapper">
            <section aria-labelledby="items-heading" class="items-section">
                <h2 id="items-heading">Items in Cart</h2>
                <div class="item-card" data-testid="cart-item-1">
                    <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" alt="Wireless Noise Cancelling Headphones" />
                    <span class="item-title">Wireless Headphones</span>
                    <span class="item-price">$199.99</span>
                </div>
            </section>
        </div>

        <section class="checkout-summary" aria-label="Order Summary">
            <h2>Order Total</h2>
            <p class="total-amount">$199.99</p>

            <form id="shipping-form" action="/submit-order" method="POST">
                <label for="email-input">Email Address</label>
                <input type="email" id="email-input" name="email" placeholder="you@domain.com" required />

                <label for="address-input">Shipping Address</label>
                <input type="text" id="address-input" name="address" placeholder="123 Innovation Way" required />

                <!-- Original selector targeted by tests -->
                <button type="submit" id="buy-now" class="btn-primary" role="button" aria-label="Complete Order">
                    <svg height="16" width="16" viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2z"/></svg>
                    Place Your Order
                </button>
            </form>
        </section>
    </main>

    <footer role="contentinfo" class="footer-area">
        <p>&copy; 2026 KernHell Systems Inc. All rights reserved.</p>
    </footer>

    <script src="https://cdn.example.com/bundle.min.js"></script>
</body>
</html>
